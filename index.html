<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>점심/저녁 추천 슬롯</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0c10;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app { width: 100%; max-width: 420px; padding: 16px; }
    .card {
      background: radial-gradient(circle at top, #2b2f4a, #111322 60%, #05060a);
      border-radius: 24px;
      padding: 20px 16px;
      min-height: 430px;
      position: relative;
      overflow: hidden;
    }

    .title { text-align: center; margin-bottom: 12px; }
    .title-main { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
    .title-sub { font-size: 12px; opacity: 0.7; margin-top: 4px; }

    .view { width: 100%; height: calc(100% - 52px); position: relative; }
    .hidden { display: none; }

    /* ---------- 모드 선택 화면 ---------- */

    .mode-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .mode-desc {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 8px;
      text-align: center;
      line-height: 1.4;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
    }

    .mode-button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    .mode-button.lunch {
      background: linear-gradient(135deg, #ffb347, #ff7b47);
      color: #141414;
    }

    .mode-button.dinner {
      background: linear-gradient(135deg, #6a8bff, #9a6aff);
      color: #f5f5ff;
    }

    /* ---------- 슬롯 화면 ---------- */

    .wheel-wrapper {
      width: 320px;
      height: 320px;
      margin: 0 auto;
      position: relative;
    }

    .wheel-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 25%, #f4f4f4 55%, #e8e8e8);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }

    .wheel {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 4px solid rgba(0,0,0,0.18);
      transform: rotate(0deg);
    }

    .slice-divider {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 50%;
      height: 2px;
      background: rgba(0,0,0,0.18);
      transform-origin: 0 50%;
    }

    .slice-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 0 0;
      width: 50%;
      text-align: center;
      font-size: 12px;
      color: #333;
      font-weight: 600;
    }

    .slice-label span {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.08);
    }

    .pointer {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 18px solid #ffeb8a;
      z-index: 3;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.8));
    }

    .spin-button {
      margin-top: 20px;
      display: block;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ff7070, #ff3b3b);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
      white-space: nowrap;
    }

    .spin-button.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    /* ---------- 결과 화면 ---------- */

    .result-view {
      text-align: center;
      padding-top: 16px;
    }

    .result-title {
      opacity: 0.7;
      font-size: 12px;
    }

    .result-main {
      font-size: 20px;
      font-weight: 700;
      margin: 10px 0 16px;
      line-height: 1.4;
    }

    .result-character-box {
      width: 180px;
      height: 230px;
      background: linear-gradient(135deg, #ff7bc2, #7f7bff);
      border-radius: 24px;
      overflow: hidden;
      margin: 0 auto 12px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .result-character-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111;
    }

    .result-char-name {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .result-line {
      font-size: 14px;
      margin-bottom: 12px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .result-retry-button {
      border: none;
      padding: 10px 20px;
      background: rgba(255,204,92,0.2);
      border: 1px solid rgba(255,204,92,1);
      border-radius: 999px;
      color: #ffd86b;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="card">

      <div class="title">
        <div class="title-main">MEAL SLOT</div>
        <div class="title-sub" id="titleSub">오늘 메뉴는 캐릭터에게 맡겨보자</div>
      </div>

      <!-- 1. 점심/저녁 선택 화면 -->
      <div id="modeView" class="view mode-view">
        <div class="mode-desc">
          어떤 룰렛을 돌릴까요?
        </div>
        <div class="mode-buttons">
          <button id="lunchModeButton" class="mode-button lunch">점심 룰렛</button>
          <button id="dinnerModeButton" class="mode-button dinner">저녁 룰렛</button>
        </div>
      </div>

      <!-- 2. 슬롯 화면 -->
      <div id="slotView" class="view hidden">
        <div class="wheel-wrapper">
          <div class="wheel-base"></div>
          <div id="wheel" class="wheel"></div>
          <div class="pointer"></div>
        </div>

        <button id="spinButton" class="spin-button">메뉴 추천</button>
      </div>

      <!-- 3. 결과 화면 -->
      <div id="resultView" class="view hidden">
        <div class="result-title">오늘의 추천 결과</div>
        <div class="result-main" id="resultMain"></div>

        <div class="result-character-box" id="resultCharacterBox">
          <span>캐릭터</span>
          <div class="result-char-name" id="resultCharName">???</div>
        </div>

        <div class="result-line" id="resultLine"></div>

        <button id="resultRetryButton" class="result-retry-button">
          메뉴 다시 추천
        </button>
      </div>

    </div>
  </div>

      },
      {
        id: 7, label: "분식",
        character: {
          name: "레니",
          image: "이미지/레니.jpg",
          line: "띠용~ 띠용~"
        },
        menus: ["떡볶이","라볶이","순대세트","김밥","어묵세트","라면","쫄면","튀김세트"]
      }
    ];

    // 저녁용 데이터: 일단 점심과 동일하게 복사.
    // 나중에 이미지/메뉴/대사를 변경하고 싶으면 여기 DINNER_CATEGORY_DATA만 수정하면 된다.
    const DINNER_CATEGORY_DATA = [
  {
    id: 0, label: "밥도둑",
    character: {
      name: "루크",
      image: "이미지/루크.jpg",
      line: "무엇을 추천해드릴까요?"
    },
    menus: [
      "간장게장","양념게장","코다리조림","갈치조림",
      "장어구이","낙지볶음","소갈비찜","제육보쌈"
    ]
  },
  {
    id: 1, label: "면류",
    character: {

      image: "이미지/바바라.jpg",

    },
    menus: [

  },
  {

      "돈카츠나베","나베우동","타코야키","오코노미야키"

  {

    ]
  },
  {
    id: 4, label: "중식",
    character: {
      name: "리다이린",

    },
    menus: [

      "팔보채","고추잡채","깐쇼새우","짬뽕탕"
    ]
  },
  {
    id: 5, label: "귀찮음",
    character: {
      name: "아이솔",
      image: "이미지/아이솔.jpg",
      line: "저녁은..이거면 될 거 같군요."
    },
    menus: [
      "치킨너겟에맥주","냉동피자","전자레인지볶음밥","소시지야채볶음",
      "참치마요주먹밥","야식토스트","콘치즈","치즈나쵸"
    ]
  },
  {
    id: 6, label: "헤비",
    character: {
      name: "레녹스",
      image: "이미지/레녹스.jpg",
      line: "자, 오늘은 어떤 메뉴가 날 기다릴까?"
    },
    menus: [
      "후라이드치킨","양념치킨","족발","보쌈",
      "소곱창구이","삼겹살구이","등갈비구이","치즈불닭"
    ]
  },
  {

    character: {

      image: "이미지/엠마.jpg",

    },
    menus: [
      "야식떡볶이","모둠튀김","순대곱창볶음","치즈라면",

    ]
  }
];

    // ---------- 2. 공통 요소 ----------

    const pointerAngle = 270; // 12시 방향

    const wheelEl = document.getElementById("wheel");
    const spinButton = document.getElementById("spinButton");
    const slotView = document.getElementById("slotView");
    const resultView = document.getElementById("resultView");
    const modeView = document.getElementById("modeView");
    const titleSubEl = document.getElementById("titleSub");

    const lunchModeButton = document.getElementById("lunchModeButton");
    const dinnerModeButton = document.getElementById("dinnerModeButton");

    const resultMain = document.getElementById("resultMain");
    const resultLine = document.getElementById("resultLine");
    const resultCharName = document.getElementById("resultCharName");
    const resultCharacterBox = document.getElementById("resultCharacterBox");
    const resultRetryButton = document.getElementById("resultRetryButton");

    let isSpinning = false;
    let currentMode = null;      // 'lunch' | 'dinner'
    let currentData = LUNCH_CATEGORY_DATA;
    let currentSliceDeg = 360 / currentData.length;

    // ---------- 3. 휠 구성 ----------

    function buildWheel() {
      // 기존 divider/label 모두 제거
      wheelEl.innerHTML = "";
      currentSliceDeg = 360 / currentData.length;

      currentData.forEach((cat, i) => {
        const baseAngle = i * currentSliceDeg;
        const centerAngle = baseAngle + currentSliceDeg / 2; // 섹터 중앙 각도(3시 기준)

        // 구분선
        const divider = document.createElement("div");
        divider.className = "slice-divider";
        divider.style.transform = `rotate(${baseAngle}deg)`;
        wheelEl.appendChild(divider);

        // 라벨: 원 중심과 테두리 중간쯤 (필요 시 숫자 조절)
        const label = document.createElement("div");
        label.className = "slice-label";
        label.style.transform = `rotate(${centerAngle}deg) translate(35px, -50%)`;
        label.innerHTML = `<span>${cat.label}</span>`;
        wheelEl.appendChild(label);
      });
    }

    // ---------- 4. 결과 화면 ----------

    function showResult(category, menu) {
      const mealText = currentMode === "dinner" ? "저녁" : "점심";
      resultMain.textContent = `오늘 ${mealText}은 "${menu}" 어때?`;
      resultLine.textContent = category.character.line;
      resultCharName.textContent = category.character.name || "???";

      const oldImg = resultCharacterBox.querySelector("img");
      const placeholder = resultCharacterBox.querySelector("span");

      if (category.character.image) {
        if (!oldImg) {
          const img = document.createElement("img");
          img.src = category.character.image;
          img.alt = category.character.name || "캐릭터";
          resultCharacterBox.insertBefore(img, placeholder);
        } else {
          oldImg.src = category.character.image;
          oldImg.alt = category.character.name || "캐릭터";
        }
        if (placeholder) placeholder.style.display = "none";
      } else {
        if (oldImg) oldImg.remove();
        if (placeholder) {
          placeholder.style.display = "block";
          placeholder.textContent = "캐릭터";
        }
      }

      slotView.classList.add("hidden");
      resultView.classList.remove("hidden");
    }

    // ---------- 5. 회전 + 결과 연동 ----------

    function spin() {
      if (isSpinning || !currentMode) return;
      isSpinning = true;
      spinButton.classList.add("disabled");

      // 슬롯 화면에서 시작
      resultView.classList.add("hidden");
      slotView.classList.remove("hidden");

      // 1) 어떤 카테고리에 멈출지 먼저 결정
      const chosenIndex = Math.floor(Math.random() * currentData.length);
      const category = currentData[chosenIndex];
      const menu = category.menus[Math.floor(Math.random() * category.menus.length)];

      // 2) 그 카테고리 섹터 중앙이 포인터(12시)에 오도록 회전 각도 계산
      const sectorCenterAngle = currentSliceDeg * chosenIndex + currentSliceDeg / 2;
      const randomTurns = 5 + Math.floor(Math.random() * 3); // 5~7바퀴
      const finalRotation = randomTurns * 360 + (pointerAngle - sectorCenterAngle);

      // 3) 이전 회전 상태 초기화 후 애니메이션
      wheelEl.style.transition = "none";
      wheelEl.style.transform = "rotate(0deg)";
      void wheelEl.offsetWidth; // 리플로우

      wheelEl.style.transition = "transform 3s cubic-bezier(0.21,0.95,0.45,1)";
      wheelEl.style.transform = `rotate(${finalRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinButton.classList.remove("disabled");
        showResult(category, menu);
      }, 3100);
    }

    // ---------- 6. 모드 선택 ----------

    function selectMode(mode) {
      currentMode = mode;
      currentData = mode === "lunch" ? LUNCH_CATEGORY_DATA : DINNER_CATEGORY_DATA;
      buildWheel();

      modeView.classList.add("hidden");
      slotView.classList.remove("hidden");
      resultView.classList.add("hidden");

      if (mode === "lunch") {
        spinButton.textContent = "점심 추천";
        titleSubEl.textContent = "오늘 점심 메뉴는 실험체에게 맡겨보자";
      } else {
        spinButton.textContent = "저녁 추천";
        titleSubEl.textContent = "오늘 저녁 메뉴는 실험체에게 맡겨보자";
      }
    }

    // ---------- 7. 이벤트 ----------

    lunchModeButton.addEventListener("click", () => selectMode("lunch"));
    dinnerModeButton.addEventListener("click", () => selectMode("dinner"));

    spinButton.addEventListener("click", spin);
    resultRetryButton.addEventListener("click", spin);
  </script>
